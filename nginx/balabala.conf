# 叽里呱啦 · nginx 站点配置（容器内 /etc/nginx/conf.d/default.conf）
#
# 职责：
#   1. 静态托管 apps/web/dist（Vite + React SPA，含 PWA）
#   2. 反向代理 /api/* 到 Fastify（api:8787），含 WebSocket 升级
#   3. 把前端探测的 /api/health 映射到后端真实路由 /health

server {
    listen       80;
    server_name  _;

    # 上传/模型生图等请求体上限（后端 Fastify bodyLimit = 20MB）
    client_max_body_size 20m;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip 文本资源（.glb 大模型已在 PWA 配置中排除缓存，不影响）
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript
                    application/xml image/svg+xml font/woff font/woff2;

    # ---- WebSocket 代理头（/api/ws）----
    # 前端在同源下 new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/api/ws')
    location /api/ws {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 长连接不主动断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- 健康检查：前端探测 /api/health，后端路由实为 /health ----
    location = /api/health {
        proxy_pass http://api:8787/health;
        access_log off;
    }

    # ---- 其余 /api/* REST / SSE 流 ----
    location /api/ {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 流（庭审流式输出）：关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ---- 后端直连健康路由（可选，便于运维探活）----
    location = /health {
        proxy_pass http://api:8787/health;
        access_log off;
    }

    # ---- 静态资源缓存：带 hash 的 assets 长缓存 ----
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA 回退：未知路径交给 index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
