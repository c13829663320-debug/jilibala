# =============================================================================
# 叽里呱啦 (balabala-court) · Nginx 反向代理 / 静态托管配置
# -----------------------------------------------------------------------------
# 架构：
#   浏览器 ──HTTPS/443──▶ Nginx ──┬─ /            ──▶ 静态文件 apps/web/dist (SPA)
#                                 ├─ /api/        ──▶ Fastify API (HTTP+WS 同端口 8787)
#                                 └─ /health      ──▶ Fastify API 健康检查
#
# 使用前必改：
#   1) server_name  your-domain.com   → 改成你的真实域名
#   2) ssl_certificate / ssl_certificate_key 路径（见 docs/https-setup.md）
#   3) root  指向生产构建产物 apps/web/dist 的绝对路径
#   4) upstream balabala_api：宿主机部署保持 127.0.0.1:8787；
#      Docker Compose 同栈部署时改为 server api:8787;
#
# 校验：sudo nginx -t    重载：sudo nginx -s reload
# =============================================================================

# ---- API 上游（Fastify 5，HTTP + WebSocket 同端口 8787）-------------------
upstream balabala_api {
    # 宿主机直连（systemd / pm2 直接跑 node dist/server.js）：
    server 127.0.0.1:8787;
    # Docker Compose 网络内（nginx 与 api 同一 compose 栈）改为：
    # server api:8787;

    # 复用 TCP 连接，降低 WS/HTTP 短连接握手开销
    keepalive 32;
}

# WebSocket Connection 映射：仅当请求带 Upgrade 头时发送 "upgrade"，
# 否则回落到 "close"，避免给普通 HTTP 请求错误地发 Connection: upgrade。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- 日志格式（记录上游响应时间与真实客户端 IP）---------------------------
log_format balabala '$remote_addr - $host [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';

# =============================================================================
# HTTP :80  —— 仅保留 ACME 证书验证，其余全部 301 到 HTTPS
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # Let's Encrypt webroot 验证（certbot certonly --webroot）
    # 必须在重定向之前命中，否则证书申请/续期会失败
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;   # 与 certbot -w / webroot-path 保持一致
        default_type "text/plain";
        try_files $uri =404;
    }

    # 其余 HTTP 请求一律永久跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# HTTPS :443 —— 主站点
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com;

    # ---- TLS 证书（Let's Encrypt，见 docs/https-setup.md）-----------------
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # TLS 加固：协议、 cipher、会话缓存
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- 客户端请求体上限：与 Fastify bodyLimit (20MB) 对齐----------------
    client_max_body_size 20m;
    client_body_buffer_size 128k;

    # ---- 全局 gzip（js/css/html/json/svg/xml）----------------------------
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/x-javascript application/ld+json image/svg+xml
                      application/xml+rss font/ttf font/otf application/vnd.ms-fontobject;

    access_log /var/log/nginx/balabala.access.log balabala;
    error_log  /var/log/nginx/balabala.error.log warn;

    # ---- 安全响应头（合理宽松，不阻塞自身 SPA 与 WS）----------------------
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    # HSTS：首次确认证书无误后再开启（max-age 建议先 300 观察，稳定后再拉长）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP：允许同源、ws/wss 信令、data: 内联资源（three.js/wasm 常见）、
    #      以及 Google STUN 所需的同源连接；script/style 不注入第三方。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' ws: wss: https:; worker-src 'self' blob:; frame-ancestors 'self'" always;

    # ---- 前端静态资源（Vite 构建产物 apps/web/dist）----------------------
    root  /var/www/balabala/web/dist;
    index index.html;

    # 带 hash 的静态资源长缓存；index.html 不缓存以便发版即时生效
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA 路由回退：所有非文件路径交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ---- 健康检查（/health 直接代理到 API，便于负载均衡/监控）--------------
    location = /health {
        proxy_pass http://balabala_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ---- API + WebSocket 反代---------------------------------------------
    # /api 同时承载 HTTP REST 与 /api/ws 的 WebSocket Upgrade。
    location /api/ {
        proxy_pass http://balabala_api;
        proxy_http_version 1.1;

        # WebSocket Upgrade 头（关键：缺了这两行 /api/ws 无法握手）
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;

        # 透传真实客户端信息，Fastify 据此记录日志/审计
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接：房间中继是常驻连接，必须把读/写超时拉到 24h，
        # 否则 Nginx 默认 60s 空闲会主动断 WS，导致房间掉线重连。
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # HTTP REST 接口超时（LLM 庭审可能较慢，留 120s）
        proxy_connect_timeout 10s;
    }
}
