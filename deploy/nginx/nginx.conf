# =============================================================================
# 叽里呱啦 (balabala-court) · Gateway 生产反代配置（容器内 conf.d/default.conf）
# -----------------------------------------------------------------------------
# 本配置运行在 gateway 容器（docker compose --profile production），职责：
#   * TLS 终止（80→443，证书位于 /etc/nginx/certs/）
#   * 安全响应头 / gzip / HTTP2
#   * ACME webroot 证书续期入口
#   * 全部业务流量反代到内网 web:80（web 再做静态 SPA + /api→api:8787）
#
# 链路：
#   浏览器 ──443──▶ gateway ──▶ web:80 ──▶ api:8787
#                                   │
#                                   └─ 静态 SPA 由 web 容器托管（apps/web/dist）
#
# 证书：约定挂载命名卷 certs 到 /etc/nginx/certs：
#       /etc/nginx/certs/fullchain.pem
#       /etc/nginx/certs/privkey.pem
# 校验：docker compose exec gateway nginx -t
# =============================================================================

# ---- 上游：内网 web 容器（nginx 静态 + /api 反代）--------------------------
upstream balabala_web {
    server web:80;
    # 复用 TCP 连接，降低 WS/HTTP 短连接握手开销
    keepalive 32;
}

# WebSocket Connection 映射：仅当请求带 Upgrade 头时发送 "upgrade"，
# 否则回落到 "close"，避免给普通 HTTP 请求错误地发 Connection: upgrade。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- 日志格式（记录上游响应时间与真实客户端 IP）---------------------------
log_format balabala '$remote_addr - $host [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';

# =============================================================================
# HTTP :80 —— 仅保留 ACME 证书验证，其余全部 301 到 HTTPS
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt webroot 验证（certbot certonly --webroot -w /var/www/letsencrypt）
    # 与 compose 挂载 ./deploy/letsencrypt:/var/www/letsencrypt:ro 对应
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 其余 HTTP 请求一律永久跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# HTTPS :443 —— 主站点（TLS 终止后整体反代到 web:80）
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # ---- TLS 证书（命名卷 certs 挂载到此处）--------------------------------
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 加固：协议、cipher、会话缓存
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- 客户端请求体上限：与 Fastify bodyLimit (20MB) 对齐-------------------
    client_max_body_size 20m;
    client_body_buffer_size 128k;

    # ---- gzip（对来自 web 的响应再次压缩，文本类）--------------------------
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/x-javascript application/ld+json image/svg+xml
                      application/xml+rss font/ttf font/otf application/vnd.ms-fontobject;

    access_log /var/log/nginx/balabala.access.log balabala;
    error_log  /var/log/nginx/balabala.error.log warn;

    # ---- 安全响应头（不阻塞自身 SPA / WS）----------------------------------
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    # HSTS：证书确认无误后保持开启；首次上线可先把 max-age 调成 300 观察
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP：允许同源、ws/wss 信令、data:/blob: 内联资源（three.js/wasm）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' ws: wss: https:; worker-src 'self' blob:; frame-ancestors 'self'" always;

    # ---- 健康检查（容器 healthcheck 与外部监控都打这里）--------------------
    # web 容器内 /health 已映射到 api /health
    location = /health {
        proxy_pass http://balabala_web/health;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ---- 其余全部流量（静态 SPA + /api REST + /api/ws）反代到 web:80 --------
    # web 容器自己负责：静态托管、/api/ws 的 WS Upgrade、SSE 不缓冲。
    # 这里只需透传 Upgrade 头，并把长连接超时拉长（房间 WS 常驻）。
    location / {
        proxy_pass http://balabala_web;
        proxy_http_version 1.1;

        # WebSocket Upgrade 头（关键：缺了这两行 /api/ws 无法握手）
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # 透传真实客户端信息，Fastify 据此记录日志/审计
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接：房间中继常驻，读写超时拉到 24h
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;

        # SSE 流式庭审输出：关闭缓冲
        proxy_buffering off;
        proxy_cache off;
    }
}
