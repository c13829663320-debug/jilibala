# =============================================================================
# 叽里呱啦 · coturn (STUN/TURN) 配置示例
# -----------------------------------------------------------------------------
# 作用：为多人房间的 WebRTC 空间语音提供 NAT 穿越中继。
#       - STUN：帮助客户端发现自己的公网映射地址（多数家用 NAT 够用）
#       - TURN：对称 NAT / 严格企业防火墙下，P2P 打洞失败时强制中继媒体流
#
# 当前代码状态（apps/web/src/voice/useSpatialVoice.ts DEFAULT_RTC_CONFIG）：
#       已内置 Google 公共 STUN： stun:stun.l.google.com:19302
#       本 TURN 为「生产对称 NAT 兜底」，部署后在前端 iceServers 追加即可。
#
# 部署位置：宿主机 /etc/turnserver.conf 或容器挂载到 /etc/coturn/turnserver.conf
# 官方文档：https://github.com/coturn/coturn/blob/master/examples/etc/turnserver.conf
# =============================================================================

# ---- 监听端口 --------------------------------------------------------------
# STUN/TURN 明文端口（UDP 为主，TCP/TLS 备选）
listening-port=3478
# 加密 TURN over TLS/DTLS 端口（需要证书时启用）
tls-listening-port=5349

# 监听地址：默认全部网卡。容器部署可显式写 0.0.0.0
listening-ip=0.0.0.0
# 内部 relay 端口绑定地址（通常与 listening-ip 相同）
relay-ip=0.0.0.0

# ---- 外部公网 IP（关键！NAT/云主机上必须设置）------------------------------
# coturn 无法自动探测云厂商 NAT 后的公网 IP，必须显式填写，
# 否则 allocate 响应里给客户端的 relay 地址是内网 IP，媒体无法回传。
# 换成你这台 TURN 服务器的公网 IPv4（域名也可，但 A 记录必须指向它）。
external-ip=203.0.113.10

# ---- Realm / 域名 ----------------------------------------------------------
# realm 是 TURN 鉴权的「域」，必须与前端 iceServers 里配置一致；
# server-name 一般与 realm 相同。
realm=your-domain.com
server-name=your-domain.com

# ---- 鉴权（长期凭据机制）---------------------------------------------------
# lt-cred-mech = Long-Term Credential Mechanism，TURN 标准鉴权方式。
lt-cred-mech
# 静态用户名:密码（生产环境务必改成强随机串，轮换见 docs/stun-turn.md）。
# 前端 RTCConfiguration 里的 username/credential 必须与此处一致。
user=balabala:CHANGE_ME_to_a_long_random_password

# 不启用 admin 控制接口（避免暴露管理面）
no-admin
# 关闭 CLI 控制端口
no-cli

# ---- 媒体中继端口范围 ------------------------------------------------------
# TURN 为每条媒体流分配一对 UDP 端口，范围越大并发能力越强。
# 防火墙/安全组必须放行 UDP 整个区间（见 docs/stun-turn.md）。
min-port=49152
max-port=65535

# ---- 日志 ------------------------------------------------------------------
# 详细日志：生产用 info 即可；排查打洞失败时临时调成 verbose。
log-file=/var/log/coturn/turnserver.log
# 同时输出到 syslog
syslog
# 不把敏感凭据写进日志
no-stdout-log

# ---- 安全加固 --------------------------------------------------------------
# 防止被当作开放中继滥用：TURN 凭据鉴权本身已保证只有合法用户能分配中继，
# 不建议默认开启 denied-peer-ip（会把真实浏览器对端 IP 也屏蔽，导致通话黑屏）。
# 仅当你需要把中继目的网段限制在特定范围时，才放开下面两行：
# denied-peer-ip=0.0.0.0-255.255.255.255
# allowed-peer-ip=127.0.0.1-127.0.0.1

# 防止被当作开放中继滥用：限制 allocation 生命周期
stale-nonce=600
# 每个 allocation 最大生命（秒），避免僵尸会话占端口
maxALLOCATION_LIFETIME=600
# 单用户并发 session 上限
user-quota=20
# 全服务器并发 allocation 上限（按内存/带宽调整）
total-quota=2000

# ---- TLS 证书（5349 端口需要；用 3478 明文 UDP 可先注释掉）-----------------
# 证书与 nginx 复用同一套 Let's Encrypt 证书即可
# cert=/etc/letsencrypt/live/your-domain.com/fullchain.pem
# pkey=/etc/letsencrypt/live/your-domain.com/privkey.pem
# 优先用 DTLS 1.2+
# no-tlsv1
# no-tlsv1_1

# ---- 其他 ------------------------------------------------------------------
#  fingerprint：在 STUN 消息里加指纹（默认开）
#  mobility：支持 ICE mobility（默认开）
#  verbose：临时排查打洞问题时打开，日志量很大
# verbose
