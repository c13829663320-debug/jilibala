# ============================================================
# R5 发布域：docker-compose.yml —— 一键公网部署编排
# 服务：api(Fastify+WS) / web(静态PWA) / nginx(HTTPS/WSS 反代) / coturn(WebRTC TURN)
# 用法：cp .env.example .env 后 docker compose up -d --build
# 注意：所有密钥/证书均为占位符，公网部署前必须替换（见 docs/DEPLOYMENT.md）。
# ============================================================
services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: production
      # 上游 AI 网关密钥（留空则走离线降级）
      STEPFUN_API_KEY: ${STEPFUN_API_KEY:-}
      TRIPO_API_KEY: ${TRIPO_API_KEY:-}
    volumes:
      - api_data:/data
    expose:
      - "3001"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SSL_CERT_PATH:-./ssl}:/etc/nginx/ssl:ro
    environment:
      DOMAIN: ${DOMAIN:-example.com}

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478"          # TURN/STUN UDP+TCP
      - "5349:5349"          # TURN over TLS
      - "49152-49200:49152-49200/udp"  # WebRTC relay 端口范围

volumes:
  api_data:
