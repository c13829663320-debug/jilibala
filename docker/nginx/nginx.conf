# ============================================================
# R5 发布域：nginx 反向代理配置模板（HTTPS/WSS）
# - 80 → 301 跳转 HTTPS
# - 443 TLS 终止：/api/ws 与 /api/* → api:3001；/ → web:80
# - gzip、静态资源长缓存、PWA manifest、WebSocket upgrade
# 证书路径见 .env 的 SSL_CERT_PATH（容器内挂载到 /etc/nginx/ssl）。
# 域名 example.com 为占位符，部署时替换为真实 DOMAIN。
# ============================================================

# ---- HTTP: 跳转 HTTPS ----
server {
  listen 80;
  server_name example.com;
  return 301 https://$host$request_uri;
}

# ---- HTTPS ----
server {
  listen 443 ssl;
  http2 on;
  server_name example.com;

  ssl_certificate     /etc/nginx/ssl/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  # gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 1024;

  # ---- API（含 WebSocket）----
  location /api/ws {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;   # 长连接不超时
  }
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ---- PWA 静态资源：带内容 hash 的产物长缓存 ----
  location /assets/ {
    proxy_pass http://web:80;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
  # manifest / sw / index：NetworkFirst，必须短缓存
  location = /sw.js {
    proxy_pass http://web:80;
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    proxy_pass http://web:80;
    add_header Cache-Control "no-cache";
  }

  # ---- 前端 SPA ----
  location / {
    proxy_pass http://web:80;
    add_header Cache-Control "no-cache";
  }
}
