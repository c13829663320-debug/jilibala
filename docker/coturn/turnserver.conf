# ============================================================
# R5 发布域：coturn TURN 配置模板（WebRTC 中继）
# 占位符：realm / 证书路径 / REST API 密钥。公网部署前必须替换。
# 配合前端 WebRTC：STUN 打洞失败时走 TURN 中继，保证对称 NAT 下也能连通。
# ============================================================

listening-port=3478
tls-listening-port=5349

# 对外域名/IP（替换为你的公网域名）
relay-ip=YOUR_SERVER_PUBLIC_IP
external-ip=YOUR_SERVER_PUBLIC_IP
realm=example.com
server-name=example.com

# 长期凭证机制（前端通过 REST API 临时拿 username/credential，不在前端硬编码密钥）
use-auth-secret
static-auth-secret=REPLACE_WITH_REAL_TURN_SECRET

# 中继端口范围（与 compose 端口映射一致）
min-port=49152
max-port=49200

# TLS 证书（TURN over TLS，可选）
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

# 安全：不允许未授权分配
no-cli
no-tcp-relay
fingerprint
lt-cred-mech
# 日志
log-file=stdout
verbose
