<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>当前离线 · 叽里呱啦</title>
    <style>
      :root {
        --bg: #000000;
        --yellow: #ffd700;
        --cyan: #00ced1;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        background: var(--bg);
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 420px;
        width: 100%;
        padding: 40px 28px;
        border: 1px solid rgba(255, 215, 0, 0.35);
        border-radius: 18px;
        background: linear-gradient(180deg, #0a0a0a 0%, #000000 100%);
        box-shadow: 0 16px 60px rgba(0, 0, 0, 0.6);
      }
      .badge {
        display: inline-block;
        font-size: 12px;
        letter-spacing: 2px;
        color: var(--cyan);
        border: 1px solid var(--cyan);
        border-radius: 999px;
        padding: 4px 12px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 22px;
        color: var(--yellow);
        margin-bottom: 12px;
        line-height: 1.4;
      }
      p {
        font-size: 14px;
        line-height: 1.7;
        color: #cfcfcf;
        margin-bottom: 28px;
      }
      .retry {
        appearance: none;
        border: none;
        cursor: pointer;
        background: var(--yellow);
        color: #000;
        font-size: 15px;
        font-weight: 700;
        padding: 12px 28px;
        border-radius: 12px;
        transition: transform 0.1s ease, box-shadow 0.1s ease;
      }
      .retry:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(255, 215, 0, 0.25); }
      .retry:active { transform: translateY(0); }
      .hint { margin-top: 18px; font-size: 12px; color: #777; }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">OFFLINE</span>
      <h1>当前离线，部分功能不可用</h1>
      <p>
        你现在没有网络连接。已缓存的页面可以继续浏览，但开庭、连麦、加载 3D 模型与
        AI 对话等需要联网的功能暂时无法使用。
      </p>
      <button class="retry" onclick="window.location.reload()">重新连接</button>
      <div class="hint">叽里呱啦 · BalaBala</div>
    </main>
    <script>
      // 在线时自动刷新一次，帮助用户尽快恢复。
      window.addEventListener('online', function () { window.location.reload(); });
    </script>
  </body>
</html>
