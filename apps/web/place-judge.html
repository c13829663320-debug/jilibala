<!doctype html><html><head><meta charset=utf8><style>body{margin:0}</style></head><body>
<script type=module>
import * as THREE from 'three'
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js'
import { MeshoptDecoder } from 'three/examples/jsm/libs/meshopt_decoder.module.js'
const loader=new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder)
const loadP=(u)=>new Promise((res,rej)=>loader.load(u,g=>res(g),undefined,rej))
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true})
renderer.setSize(1600,900);document.body.appendChild(renderer.domElement)
const scene=new THREE.Scene();scene.background=new THREE.Color('#1a120c')
scene.add(new THREE.AmbientLight(0xffe6c4,1.1))
const dl=new THREE.DirectionalLight(0xfff0d8,2.4);dl.position.set(4,8,5);scene.add(dl)
const camera=new THREE.PerspectiveCamera(50,1600/900,0.1,100)
camera.position.set(0,2.0,5.4);camera.lookAt(0,1.1,-2.8)
// environment, same normalization as CourtroomEnvironmentModel (scale 10.8)
const envG=await loadP('/models/balabala_courtroom.glb')
const ec=envG.scene.clone(true)
let b=new THREE.Box3().setFromObject(ec);let sz=b.getSize(new THREE.Vector3());const c=b.getCenter(new THREE.Vector3())
const es=10.8/Math.max(sz.x,sz.y,sz.z,1e-3);ec.scale.setScalar(es)
ec.position.set(-c.x*es,-b.min.y*es,-c.z*es);scene.add(ec)
// judge, normalized height 1.8
const jg=await loadP('/models/court/judge.glb')
function normJudge(){
  const cl=jg.scene.clone(true)
  const bb=new THREE.Box3().setFromObject(cl),s2=bb.getSize(new THREE.Vector3()),c2=bb.getCenter(new THREE.Vector3())
  const sc=1.8/Math.max(s2.y,1e-3);cl.scale.setScalar(sc)
  cl.position.set(-c2.x*sc,-bb.min.y*sc,-c2.z*sc);return cl
}
const zs=[-4.3,-3.9,-3.5,-3.1,-2.7]
const colors=[0x888888,0xff5555,0x55ff55,0x5599ff,0xffcc44]
zs.forEach((zc,i)=>{
  const g=new THREE.Group();g.position.set(0,0.25,zc);g.add(normJudge())
  // marker under each
  const m=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,0.04,20),new THREE.MeshBasicMaterial({color:colors[i]}))
  m.position.set(0,-0.02,0);g.add(m);scene.add(g)
})
window.__ready=true
function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)}loop()
</script></body></html>
